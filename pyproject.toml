[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usos-planner"
version = "0.2.0"
description = "Schedule planner, USOS API registration assistant and formal-request helper for USOSweb universities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests-oauthlib>=1.3",
    "ortools>=9.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]

[project.scripts]
usos-planner = "usos_planner.cli:main"

[tool.setuptools.packages.find]
include = ["usos_planner*"]

[tool.setuptools.package-data]
"usos_planner.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
