<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>usos-planner</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--line:#dde1e8;--accent:#1f5fbf;--warn:#b42318;--ok:#067647;--soft:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#121519;--fg:#e8ebf0;--card:#1b2027;--line:#2b323c;--accent:#7aa7ff;--warn:#f97066;--ok:#47cd89;--soft:#f7b84b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header a{color:var(--fg);text-decoration:none;font-weight:600}header a.active{color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:0 0 10px}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.grid{display:grid;grid-template-columns:60px repeat(5,1fr);gap:2px;font-size:12px}
.grid .day{font-weight:600;text-align:center;padding:4px 0}
.col{position:relative;height:720px;background:var(--bg);border-radius:6px}
.block{position:absolute;left:2px;right:2px;border-radius:4px;padding:3px 4px;background:var(--accent);color:#fff;overflow:hidden;font-size:11px}
.block.conflict{background:var(--warn)}.hours{position:relative;height:720px}.hours span{position:absolute;right:6px;font-size:11px;opacity:.7}
.err{color:var(--warn)}.ok{color:var(--ok)}.soft{color:var(--soft)}
input,select,textarea,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
textarea{width:100%;min-height:320px;font-family:ui-monospace,monospace;font-size:13px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:2px;font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.muted{opacity:.7}
</style>
</head>
<body>
<header>
  <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Plany</a>
  <a href="/cases" class="{{ 'active' if request.url.path.startswith('/cases') or request.url.path.startswith('/messages') else '' }}">Rejestracje i podania</a>
  <span class="muted" style="margin-left:auto">{{ cfg.usos.base_url }}</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
