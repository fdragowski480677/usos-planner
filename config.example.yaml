# Copy to ~/.config/usos-planner/config.yaml (mode 600) and fill in, or let the
# GUI's Ustawienia page write it for you.  Nothing here is optional for the
# feature that uses it; the planner alone needs none of it.

usos:
  # Your university's USOS API installation (list: https://apps.usos.edu.pl/developers/api/definitions/installations/)
  base_url: https://usosapps.uw.edu.pl/
  # Register an application at <base_url>developers/ to get these:
  consumer_key: ""
  consumer_secret: ""
  scopes: [studies, offline_access, email]

mail:
  method: gmail         # gmail = Gmail API through the Google login, no password stored; smtp = below
  from_address: ""      # empty = the Google account; otherwise that account or one of its aliases
  # SMTP only:
  smtp_host: smtp.gmail.com
  smtp_port: 587        # 587 STARTTLS or 465 TLS; the certificate is verified
  username: ""
  password: ""          # an app password, never your real password
  bcc_self: true

student:
  full_name: ""
  index_number: ""
  programme: ""         # e.g. Informatyka, studia I stopnia
  year: ""              # e.g. II rok
  faculty: ""           # e.g. Wydział Matematyki, Informatyki i Mechaniki UW
  email: ""
  phone: ""
  vice_dean_name: ""    # e.g. dr hab. Jan Kowalski, prof. UW
  vice_dean_email: ""
  dean_office_email: ""

calendar:
  name: "Plan zajęć"            # Google calendar created in your account by `usos-planner gcal`
  timezone: Europe/Warsaw
  term_start: ""                # first day of classes, e.g. 2025-10-01 (USOS `terms/term` fills it if empty)
  term_end: ""                  # last day of classes, e.g. 2026-01-30
  holidays: []                  # e.g. ["2025-11-01", "2025-11-11", "2025-12-23"]
  # Google Cloud Console -> enable "Google Calendar API" and "Gmail API" -> OAuth client
  # "Desktop app" -> download JSON.  A relative path is next to this config.yaml:
  google_credentials_file: google_credentials.json

# login tokens, case database, uploads (default ~/.local/share/usos-planner):
# data_dir: /home/you/.local/share/usos-planner
